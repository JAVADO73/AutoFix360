<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ProductoNuevo</title>
</head>
<body>
    <h1>Registro Producto</h1>

    <form th:action="@{/productos/nuevo}" method="post">
        <p th:if="${error}" th:text="${error}"></p>
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="nombre" required>
        </div>

        <div>
            <label for="descripcion">Descripcion</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Descripcion" required>
        </div>

        <div>
            <label for="precio">Precio</label>
            <input type="number" step="0.01" id="precio" name= "precio" placeholder="Precio" required>
        </div>

        <div>
            <button type="submit">Registrar</button>
        </div>

</body>
</html>
